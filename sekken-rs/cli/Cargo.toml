[package]
name = "sekken-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sekken"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
sekken-core = { path = "../core" }
sekken-lm = { path = "../lm" }
sekken-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
